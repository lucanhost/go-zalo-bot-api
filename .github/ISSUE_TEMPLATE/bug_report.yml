name: Bug report
description: Report a problem with the SDK
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please include enough detail to reproduce it.
        **Never paste your bot token** — redact it from logs and code.
  - type: input
    id: version
    attributes:
      label: SDK version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version
      description: Output of `go version`
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A small, self-contained Go snippet or repo that reproduces the issue.
      render: go
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact your bot token.
      render: text
    validations:
      required: false
